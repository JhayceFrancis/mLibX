name: Build and Release mLibX Extension

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  version:
    name: Bump Version and Tag
    # Run only on main branch pushes and ignore commits generated by this bot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      changelog: ${{ steps.tag.outputs.changelog }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Requires a PAT to bypass branch protection rules requiring signatures/status checks
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate Next Version (Dry Run)
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true

      - name: Bump package.json and manifest.json
        run: |
          npm version ${{ steps.tag.outputs.new_version }} --no-git-tag-version
          
          # Target the correct public/ directory path as flagged by the MCP review
          jq --arg version "${{ steps.tag.outputs.new_version }}" '.version = $version' public/manifest.json > manifest.tmp.json && mv manifest.tmp.json public/manifest.json
          
      - name: Commit and Push Version Bump
        id: commit
        run: |
          # Stage the correct manifest path
          git add package.json package-lock.json public/manifest.json
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): bump version to ${{ steps.tag.outputs.new_version }} [skip ci]"
            git push origin main
            # Capture the new commit SHA so the tag attaches to this commit
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Final GitHub Tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.tag.outputs.new_version }}
          commit_sha: ${{ steps.commit.outputs.sha }}

  build:
    name: Build for ${{ matrix.browser }}
    needs: version
    # Force the job to run even if the 'version' job is skipped during a Pull Request
    if: always() && contains(fromJson('["success", "skipped"]'), needs.version.result)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, edge, firefox, brave, safari]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # Use the new tag for releases, but fallback to the standard PR branch ref if skipped
          ref: ${{ needs.version.outputs.new_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint and Type Check
        run: npm run lint

      - name: Build Extension Dashboard
        run: npm run build

      - name: Package Extension
        run: |
          mkdir -p extension-${{ matrix.browser }}
          cp -r dist/* extension-${{ matrix.browser }}/
          cd extension-${{ matrix.browser }}
          zip -r ../mLibX-${{ matrix.browser }}-extension.zip ./*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mLibX-${{ matrix.browser }}
          path: mLibX-${{ matrix.browser }}-extension.zip

  release:
    name: Publish Release Assets
    needs: [version, build]
    # Only publish a release on pushes to main, never on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: Release ${{ needs.version.outputs.new_tag }}
          body: ${{ needs.version.outputs.changelog }}
          files: artifacts/**/*.zip
